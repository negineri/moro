# tox configuration file
# This file is used to automate testing across multiple Python versions

[tox]
# List of Python environments to test
envlist =
    clean
    py310, py311, py312
    report
    docs

[testenv]
# Dependencies required for testing
deps =
    pytest
    pytest-cov  # For test coverage reporting

# Python 3.12 以降は sys.settrace ベースの計測が極端に遅く、
# パフォーマンステストがタイムアウトするため sys.monitoring (PEP 669) を使用する
setenv =
    py312: COVERAGE_CORE=sysmon

# Commands to run during testing
commands =
    pytest --cov=src --cov-append --cov-report=term-missing
depends =
    {py310,py311,py312}: clean
    report: py310,py311,py312
    docs: report
dependency_groups =
    dev

[testenv:clean]
skip_install = true
deps = coverage
commands =
    coverage erase

[testenv:report]
skip_install = true
deps = coverage
commands =
    coverage report --show-missing
    coverage html
parallel_show_output = true

[testenv:docs]
# Environment for building documentation
deps =
    mkdocs
    mkdocstrings[python]
    mkdocs-gen-files
    mkdocs-literate-nav
    mkdocs-exclude
    mkdocs-coverage
commands =
    mkdocs build
    # mkdocs build --no-directory-urls
